services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendas_pedidos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d vendas_pedidos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vendas_pedidos
      JWT_SECRET: desenvolvimento-local-chave-segura
      CORS_ORIGIN: http://localhost:3000
    command: sh -c "pnpm db:migrate:prod && pnpm db:seed:prod && pnpm start"
    ports:
      - '${API_PORT:-3001}:3000'

volumes:
  postgres_data:
